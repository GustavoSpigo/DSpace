name: Build and Deploy DSpace 6

on:
  push:
    branches:
      - dspace-6_x  # Troque para a sua branch principal se não for essa

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gustavospigo/dspace-core:latest
          # Passa os argumentos padrão caso seu Dockerfile precise deles no build
          build-args: |
            BRANCH=dspace-6_x
            TARGET_DIR=dspace-installer

      # Dispara o Webhook do DSpace 6 no seu pc05
      - name: Trigger Instant Deploy Webhook
        run: |
          curl "https://deploy.spigo.net/hooks/dspace6?token=353eb7c7f142b11b9436bdae96d6af95"