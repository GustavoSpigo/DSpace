networks:
  dspacenet:
services:
  dspace:
    container_name: dspace
    depends_on:
    - dspacedb
    image: "${DOCKER_OWNER:-dspace}/dspace:${DSPACE_VER:-dspace-6_x-jdk8-test}"
    build:
      context: .
      dockerfile: Dockerfile.jdk8-test
    networks:
      dspacenet:
    ports:
    - published: 8080
      target: 8080
    stdin_open: true
    tty: true
    volumes:
    - ./dspace/src/main/docker-compose/local.cfg:/dspace/config/local.cfg
    - ./dspace/src/main/docker-compose/xmlui.xconf:/dspace/config/xmlui.xconf
    - assetstore:/dspace/assetstore
    - solr_authority:/dspace/solr/authority/data
    - solr_oai:/dspace/solr/oai/data
    - solr_search:/dspace/solr/search/data
    - solr_statistics:/dspace/solr/statistics/data
  dspacedb:
    container_name: dspacedb
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: dspace
      POSTGRES_USER: dspace
      POSTGRES_DB: dspace
    image: dspace/dspace-postgres-pgcrypto
    networks:
      dspacenet:
    stdin_open: true
    tty: true
    # Mount an initial DB dump and a restore script into the postgres init dir.
    # The postgres image runs scripts in /docker-entrypoint-initdb.d on first init;
    # the script will restore the DB only when the database cluster is new.
    volumes:
    - ./backup.backup:/docker-entrypoint-initdb.d/backup.backup:ro
    - ./dspace-dump/dspace.dump:/docker-entrypoint-initdb.d/dspace.dump:ro
    - ./docker/db-init/restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    - pgdata:/pgdata
volumes:
  assetstore:
  pgdata:
  solr_authority:
  solr_oai:
  solr_search:
  solr_statistics:
